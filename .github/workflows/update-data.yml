# 평일 매일 저녁(한국시간 19:00)에 데이터를 새로 받아 data/site.json 을 갱신합니다.
# 갱신된 파일이 GitHub에 올라가면 Vercel이 자동으로 사이트를 다시 배포합니다.
name: 데이터 자동 갱신

on:
  schedule:
    - cron: "0 10 * * 1-5"   # UTC 10:00 = 한국시간 19:00, 월~금
  workflow_dispatch: {}        # Actions 화면에서 'Run workflow' 버튼으로 직접 실행 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 데이터 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/update_data.py
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/site.json
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date -u +'%Y-%m-%d')"
          git push
